version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmm-app:1.0.0
    container_name: mmm_app_server
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/mmm_db
      - JWT_SECRET=localdevsecretchangeinproduction12345
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0.5-jammy
    container_name: mmm_app_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data: